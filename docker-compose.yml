services:
  postgres:
    image: postgres:16-alpine
    container_name: brasa_fut_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brasa_fut
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brasa_fut"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
