name: Sofascore Auto Sync

on:
  schedule:
    # A cada 30 minutos todos os dias
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Sofascore Sync Worker
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          BRASA_API_KEY: ${{ secrets.BRASA_API_KEY }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$BRASA_API_KEY" ]; then
            echo "::error::Secret API_KEY (ou BRASA_API_KEY) não configurado. Defina em Settings > Secrets."
            exit 1
          fi
          if [ -z "$TARGET_URL" ]; then
            echo "::warning::Secret TARGET_URL não configurado, usando produção padrão."
            export TARGET_URL="https://api-brasa-fut.vercel.app"
          fi
          npm run sync:sofascore
